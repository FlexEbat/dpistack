<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dpistack</title>
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body>
<main id="login" hidden>
  <h1>dpistack</h1>
  <form id="login-form">
    <label for="password">Пароль</label>
    <input id="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Войти</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>
</main>
<main id="overview" hidden>
  <header>
    <h1>dpistack</h1>
    <button id="logout" type="button">Выйти</button>
  </header>
  <nav id="nav" aria-label="Разделы">
    <button type="button" data-view="overview" aria-current="page">Обзор</button>
    <button type="button" data-view="components">Компоненты</button>
    <button type="button" data-view="configs">Конфиги</button>
    <button type="button" data-view="rules">Правила</button>
    <button type="button" data-view="logs">Логи</button>
    <button type="button" data-view="events">События</button>
  </nav>
  <div id="view-overview">
    <p id="overview-error" class="error" role="alert"></p>
    <section id="overall" class="overall" aria-live="polite"></section>
    <h2>Компоненты</h2>
    <section id="components"></section>
    <h2>Проверки</h2>
    <section id="checks"></section>
  </div>
  <div id="view-components" hidden>
    <p id="components-error" class="error" role="alert"></p>
    <p id="components-message" class="muted" aria-live="polite"></p>
    <section id="components-list"></section>
  </div>
  <div id="view-configs" hidden>
    <div class="toolbar">
      <select id="cfg-name" aria-label="Файл"></select>
      <button id="cfg-check" type="button">Проверить</button>
      <button id="cfg-save" type="button">Сохранить</button>
      <button id="cfg-apply" type="button">Сохранить и применить</button>
      <button id="cfg-revert" type="button">Откатить</button>
    </div>
    <textarea id="cfg-editor" class="editor" spellcheck="false" autocomplete="off" aria-label="Содержимое файла"></textarea>
    <pre id="cfg-result" class="result" role="status"></pre>
  </div>
  <div id="view-rules" hidden>
    <p id="rules-error" class="error" role="alert"></p>
    <p id="rules-message" class="muted" aria-live="polite"></p>
    <div class="toolbar">
      <button id="rules-update" type="button">Обновить сейчас</button>
      <span id="rules-last" class="muted" aria-live="polite"></span>
    </div>
    <pre id="rules-update-output" class="result" role="status"></pre>
    <h2>Источники</h2>
    <section id="rules-sources"></section>
    <div class="toolbar">
      <input id="rules-url" type="text" class="wide" placeholder="https://example.org/rules.tar.gz" aria-label="Адрес нового источника" autocomplete="off">
      <button id="rules-url-add" type="button">Добавить источник</button>
    </div>
    <h2>Группы правил</h2>
    <section id="rules-groups"></section>
    <div class="toolbar">
      <input id="rules-group" type="text" class="wide" placeholder="emerging-p2p.rules" aria-label="Имя группы" autocomplete="off">
      <button id="rules-group-add" type="button">Включить группу</button>
    </div>
    <h2>Поиск правил</h2>
    <div class="toolbar">
      <input id="rules-q" type="text" class="wide" placeholder="sid или часть текста" aria-label="Поиск правила" autocomplete="off">
      <button id="rules-search" type="button">Найти</button>
    </div>
    <section id="rules-results"></section>
    <h2>Отключённые правила</h2>
    <section id="rules-disabled"></section>
  </div>
  <div id="view-logs" hidden>
    <p id="logs-error" class="error" role="alert"></p>
    <div class="toolbar">
      <select id="log-component" aria-label="Компонент"></select>
      <label>Строк <input id="log-lines" type="number" min="1" max="1000" value="200"></label>
      <button id="log-show" type="button">Показать</button>
      <button id="log-follow" type="button">Следить</button>
    </div>
    <pre id="log-output" class="log" aria-live="off"></pre>
  </div>
  <div id="view-events" hidden>
    <p id="events-error" class="error" role="alert"></p>
    <div class="toolbar">
      <select id="ev-type" aria-label="Тип события"><option value="alert">alert</option></select>
      <input id="ev-q" type="text" class="wide" placeholder="часть текста события" aria-label="Фильтр по тексту" autocomplete="off">
      <label>Показать <select id="ev-limit"><option>50</option><option>100</option><option>200</option><option>500</option></select></label>
      <button id="ev-show" type="button">Обновить</button>
      <button id="ev-follow" type="button">Следить</button>
    </div>
    <section id="ev-list"></section>
  </div>
</main>
</body>
</html>
