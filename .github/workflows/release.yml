name: release

# CD: a tag vX.Y.Z builds the archive, checks that the tag matches the
# version in the code, and publishes it with checksums and provenance.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: panel/go.mod
          check-latest: true
          cache: false
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck shfmt jq util-linux
      # Root, because the installer under test refuses to run without it.
      - run: sudo -E env "PATH=$PATH" bash scripts/gate.sh

  publish:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag must be checked against main
      - name: Tag must be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME is not on main, refusing to publish" >&2
            exit 1
          fi
      - name: Tag must match DPISTACK_VERSION
        run: |
          code_version=$(sed -n 's/^DPISTACK_VERSION="\(.*\)"$/\1/p' lib/common.sh)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$code_version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match DPISTACK_VERSION $code_version" >&2
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: panel/go.mod
          check-latest: true
          cache: false
      - name: Build archive
        run: |
          name="dpistack-${GITHUB_REF_NAME#v}"
          mkdir -p "dist/$name/tests"
          cp -a install.sh lib templates bin panel README.md LICENSE dpistack.conf.example "dist/$name/"
          # Ready panel binaries: a host without Go installs the panel from
          # these (PANEL_SOURCE=auto picks the one for its CPU).
          for arch in amd64 arm64; do
            (cd panel && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "-s -w" \
              -o "../dist/$name/dpistack-panel-linux-$arch" ./cmd/panel)
          done
          cp -a tests/data "dist/$name/tests/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          # The single-file installer and the ready panel binaries as
          # release assets of their own: dpistack-install.sh looks for the
          # panel next to itself, so a host downloads both into one folder.
          cp dpistack-install.sh dist/
          cp "dist/$name"/dpistack-panel-linux-* dist/
          (cd dist && sha256sum dpistack-install.sh > dpistack-install.sh.sha256)
          for arch in amd64 arm64; do
            (cd dist && sha256sum "dpistack-panel-linux-$arch" > "dpistack-panel-linux-$arch.sha256")
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/dpistack-install.sh
            dist/dpistack-panel-linux-amd64
            dist/dpistack-panel-linux-arm64
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/dpistack-install.sh dist/dpistack-panel-linux-amd64 dist/dpistack-panel-linux-arm64 dist/*.sha256 --generate-notes --title "$GITHUB_REF_NAME"
