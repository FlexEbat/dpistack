name: release

# CD: a tag vX.Y.Z builds the archive, checks that the tag matches the
# version in the code, and publishes it with checksums and provenance.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck shfmt jq util-linux
      # Root, because the installer under test refuses to run without it.
      - run: sudo -E env "PATH=$PATH" bash scripts/gate.sh

  publish:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the tag must be checked against main
      - name: Tag must be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME is not on main, refusing to publish" >&2
            exit 1
          fi
      - name: Tag must match DPISTACK_VERSION
        run: |
          code_version=$(sed -n 's/^DPISTACK_VERSION="\(.*\)"$/\1/p' lib/common.sh)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$code_version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match DPISTACK_VERSION $code_version" >&2
            exit 1
          fi
      - name: Build archive
        run: |
          name="dpistack-${GITHUB_REF_NAME#v}"
          mkdir -p "dist/$name/tests"
          cp -a install.sh lib templates bin README.md LICENSE dpistack.conf.example "dist/$name/"
          cp -a tests/data "dist/$name/tests/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: dist/*.tar.gz
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --generate-notes --title "$GITHUB_REF_NAME"
