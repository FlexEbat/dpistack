name: security

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # history too: a leaked token stays in old commits
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  static:
    name: shell security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: scripts/security.sh
        run: bash scripts/security.sh
      - name: shellcheck, all severities incl. style
        run: LANG=C.utf8 LC_ALL=C.utf8 shellcheck -x -S style install.sh lib/*.sh bin/dpistack-ctl bin/dpistack-watch scripts/*.sh

  trivy:
    name: trivy (config and secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # uploads SARIF to code scanning
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif
          # A finding fails the job itself; the upload below is best effort.
          exit-code: '1'
      - uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        # A pull request from a fork has a read-only token: no upload there.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        # Code scanning needs GitHub Advanced Security on a private repo;
        # without it the upload is refused and must not hide the scan result.
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
